services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}

    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - .:/var/www/html
      - composer_cache:/tmp/composer

    environment:
      COMPOSER_CACHE_DIR: /tmp/composer

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - app_network

  nginx:
    image: nginx:1.28-alpine

    restart: unless-stopped

    ports:
      - '${APP_PORT:-8000}:80'

    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - app_network

  postgres:
    image: postgres:17

    restart: unless-stopped

    ports:
      - '${DB_PORT:-5432}:5432'

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - app_network

  redis:
    image: redis:8-alpine

    restart: unless-stopped

    ports:
      - '${REDIS_PORT:-6379}:6379'

    volumes:
      - redis_data:/data

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:
  composer_cache:

networks:
  app_network:
    driver: bridge
